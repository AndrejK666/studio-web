# Studio backend — the gears assembly (20 gears, config-only).
# Image is built by CI from Dockerfile.src (requires the gears-rust sibling
# checkout in the build context) and runs with config/docker.yaml, which
# expects: DB host "postgres", bind 0.0.0.0:8090, env STUDIO_PG_PASSWORD.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-backend
spec:
  replicas: 1   # keep 1 until sessions/locking across replicas is verified
  selector:
    matchLabels: { app: studio-backend }
  template:
    metadata:
      labels: { app: studio-backend }
    spec:
      containers:
        - name: studio-backend
          image: ghcr.io/constructorfabric/studio-web/studio-backend:latest # CD pins the tag
          ports:
            - containerPort: 8090
          env:
            - name: STUDIO_PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: studio-secrets, key: pg-password }
          readinessProbe:
            httpGet: { path: /healthz, port: 8090 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8090 }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
---
# Service name "studio-backend" is load-bearing: the frontend's nginx.conf
# proxies /cf/ to http://studio-backend:8090.
apiVersion: v1
kind: Service
metadata:
  name: studio-backend
spec:
  selector: { app: studio-backend }
  ports:
    - port: 8090
      targetPort: 8090
