global:
  hostname: studio-test.cfabric.org
  environmentName: test
  environmentType: test

backend:
  image:
    tag: "sha-REPLACE_ME"
  replicas: 1
  rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
  database:
    existingSecret: studio-postgres-app
    keys:
      host: host
      port: port
      user: username
      password: password
      dbname: dbname
  bootstrap:
    # Dedicated CNPG-managed role with CREATEDB; never reuse this credential
    # in the backend Deployment.
    existingSecret: studio-postgres-bootstrap
    keys:
      host: host
      port: port
      user: username
      password: password
      dbname: dbname
  autoscaling:
    enabled: false
  sessions:
    enabled: false
  configOverride:
    existingConfigMap: ""
  idpAdmin:
    baseUrl: "https://studio-test.cfabric.org/auth"
  fileStorage:
    enabled: true
    s3:
      bucket: test-webstudio

frontend:
  image:
    tag: "sha-REPLACE_ME"
  replicas: 1
  rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
  autoscaling:
    enabled: false

frontendPrototype:
  enabled: true
  hostname: studio-test-poc.cfabric.org
  image:
    tag: "sha-REPLACE_ME"
  rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }

keycloak:
  enabled: true
  replicas: 2
  hostname: studio-test.cfabric.org
  relativePath: /auth
  image:
    tag: "sha-REPLACE_ME"

ingress:
  enabled: true
  className: traefik

# Studio owns this namespace too, and it is the bigger of the two: keep the
# ceilings it already has rather than inheriting the dev sizing, which would
# quietly halve them. Measured before writing these down (2026-09-18):
# limits 16 CPU / 32Gi, requests 8 CPU / 16Gi, 100 pods, 30 services.
#
# limits.cpu 16 with a ~4 CPU platform baseline is six concurrent sessions
# plus one terminating, at 2 CPU each.
capacity:
  enabled: true
  limits:
    cpu: 16
    memory: 32Gi
  requests:
    cpu: 8
    memory: 16Gi
    storage: 200Gi
  counts:
    pods: 100
    services: 30
    persistentVolumeClaims: 20
    configMaps: 150
    secrets: 150
