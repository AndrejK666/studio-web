global:
  hostname: studio-dev.cfabric.org
  environmentName: dev
  environmentType: dev

backend:
  image:
    tag: "sha-REPLACE_ME"
  replicas: 1
  # Dev commonly runs at CPU quota while IDE session Pods are active. Replace
  # the single replica in place instead of requiring temporary surge capacity.
  rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
  database:
    existingSecret: studio-postgres-app
    keys:
      host: host
      port: port
      user: username
      password: password
      dbname: dbname
  bootstrap:
    # Dedicated CNPG-managed role with CREATEDB; never reuse this credential
    # in the backend Deployment.
    existingSecret: studio-postgres-bootstrap
    keys:
      host: host
      port: port
      user: username
      password: password
      dbname: dbname
  autoscaling:
    enabled: false
  sessions:
    enabled: true
    # GitHub's studio-deployer cannot and must not administer RBAC. The
    # namespace-scoped session Role/RoleBinding is bootstrapped once by an
    # administrator (deploy/README.md).
    rbac:
      create: false
    # Dev projects may use arbitrary Git hosts. Test/prod should keep the
    # policy enabled and list approved provider CIDRs explicitly.
    networkPolicy:
      enabled: false
  configOverride:
    existingConfigMap: ""
  idpAdmin:
    baseUrl: "https://studio-dev.cfabric.org/auth"
  fileStorage:
    enabled: true
    s3:
      bucket: dev-webstudio

frontend:
  image:
    tag: "sha-REPLACE_ME"
  replicas: 1
  rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
  autoscaling:
    enabled: false

frontendPrototype:
  enabled: true
  hostname: studio-dev-poc.cfabric.org
  image:
    tag: "sha-REPLACE_ME"
  rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }

keycloak:
  enabled: true
  replicas: 1
  hostname: studio-dev.cfabric.org
  relativePath: /auth
  image:
    tag: "sha-REPLACE_ME"

ingress:
  enabled: true
  className: traefik
