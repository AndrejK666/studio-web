{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "spec-graph.fullname" . }}
  labels: {{- include "spec-graph.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "spec-graph.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- toYaml (required "networkPolicy.backendPodLabels is required" .Values.networkPolicy.backendPodLabels) | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.port }} }
{{- end }}
