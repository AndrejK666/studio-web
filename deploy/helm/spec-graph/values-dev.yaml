# Dev (namespace studio-dev), beside Studio's release `studio`:
#
#   helm upgrade --install spec-graph deploy/helm/spec-graph -n studio-dev \
#     -f deploy/helm/spec-graph/values-dev.yaml
#
# Before it: the Secret `studio-spec-graph` (values.yaml) and the Keycloak client `spec-graph`.
image:
  tag: "0.1.1"
studio:
  gatewayUrl: http://studio-studio-web-backend/cf
  tokenUrl: https://studio-dev.cfabric.org/auth/realms/studio/protocol/openid-connect/token
