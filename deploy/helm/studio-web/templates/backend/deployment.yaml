apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "studio-web.fullname" . }}-backend
  labels: {{- include "studio-web.labels" . | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: {{- include "studio-web.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels: {{- include "studio-web.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ include "studio-web.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ required "backend.image.tag is required (immutable, fixed at chart publication)" .Values.backend.image.tag }}"
          args: ["--config", "config/{{ .Values.backend.configProfile }}.yaml", "run"]
          ports: [{ name: http, containerPort: {{ .Values.backend.port }} }]
          env:
            - name: STUDIO_ENVIRONMENT
              value: {{ .Values.global.environmentName | quote }}
            - name: STUDIO_PG_HOST
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.database.existingSecret }}, key: host } }
            - name: STUDIO_PG_PORT
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.database.existingSecret }}, key: port } }
            - name: STUDIO_PG_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.database.existingSecret }}, key: user } }
            - name: STUDIO_PG_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.database.existingSecret }}, key: password } }
            - name: STUDIO_OIDC_ISSUER
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.auth.existingSecret }}, key: issuer_url } }
            - name: STUDIO_OIDC_CLIENT_ID
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.auth.existingSecret }}, key: client_id } }
            - name: STUDIO_OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.backend.auth.existingSecret }}, key: client_secret } }
          readinessProbe: { httpGet: { path: /cf/health, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /cf/health, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
