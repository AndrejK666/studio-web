apiVersion: v1
kind: Service
metadata:
  name: {{ include "studio-web.fullname" . }}-backend
  labels: {{- include "studio-web.labels" . | nindent 4 }}
spec:
  selector: {{- include "studio-web.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports: [{ name: http, port: 80, targetPort: http }]
