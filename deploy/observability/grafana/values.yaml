# Grafana — the only UI, and none of its state is authoritative.
#
# Persistence is off on purpose: datasources and dashboards are provisioned from
# this file and from the `studio-dashboards` ConfigMap, so a pod that is deleted
# comes back identical. Nothing that matters is allowed to live only in
# `grafana.db` — an edit made in the browser survives exactly until the next
# restart, which is the point.
#
# To change a dashboard: edit the JSON in `grafana/dashboards/`, run
# `make grafana`, reload. The UI's save button is a scratchpad, not a store.
#
# chart: grafana/grafana 10.5.15

persistence:
  enabled: false

service:
  type: ClusterIP
  port: 80

# Public access — OFF, and it needs two things this repository cannot provide.
#
#   1. A DNS record. studio-dev.cfabric.org resolves to Cloudflare (172.67.x.x)
#      and TLS terminates there: the cluster has no cert-manager Issuer and the
#      product's own Ingress carries no `tls` block. So a new host is a
#      Cloudflare record someone in infra adds, not a certificate we request.
#      That is also why there are no cert-manager annotations and no `tls` here.
#   2. The `grafana` client in the DEPLOYED realm. The public Keycloak image
#      ships no realm — it comes from the `studio-web-keycloak-realm` Secret,
#      so adding the client to `keycloak/realm-studio.json` in this repository
#      does not by itself change the running IdP. That Secret has to be
#      regenerated from the updated file.
#
# Until both exist, `kubectl -n studio-monitoring port-forward svc/grafana
# 3000:80` is the way in, and the realm client already carries the matching
# localhost redirect URIs so SSO can be exercised over that port-forward.
ingress:
  enabled: false
  ingressClassName: traefik
  # e.g. ["monitoring.cfabric.org"]. Set `grafana.ini.server.domain` to the
  # same value: the OAuth redirect is built from root_url, and a mismatch
  # sends the browser back to the wrong host after a successful login.
  hosts: []
  path: /
  pathType: Prefix
  tls: []

# The chart generates an admin password into the `grafana` Secret on first
# install and keeps it across upgrades:
#   kubectl -n studio-monitoring get secret grafana \
#     -o jsonpath='{.data.admin-password}' | base64 -d
adminUser: admin

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Fixed UID `vm`: every dashboard JSON references the datasource by this UID,
# so it must not change. Helm replaces this list wholesale — an overlay that
# adds a datasource has to restate this one.
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        uid: vm
        type: prometheus
        access: proxy
        url: http://vm-victoria-metrics-single-server.studio-monitoring.svc.cluster.local:8428
        isDefault: true
        jsonData:
          timeInterval: 30s
          # VM answers PromQL but is not Prometheus; declaring a low version
          # keeps Grafana from sending query features VM does not implement.
          prometheusType: Prometheus
          prometheusVersion: 2.24.0

# Dashboards are MOUNTED, not watched.
#
# The chart's sidecar would discover labelled ConfigMaps through the Kubernetes
# API, and on this cluster it cannot: the API server's CA carries no Authority
# Key Identifier, which current OpenSSL rejects outright
# (`CERTIFICATE_VERIFY_FAILED ... Missing Authority Key Identifier`). Rather than
# disabling certificate verification to get a file into a pod, the ConfigMap is
# mounted straight into the dashboards path and a file provider reads it. Fewer
# moving parts, no API dependency, and the same as-code guarantee.
#
# `make dashboards` rebuilds `studio-dashboards` from ./dashboards; a Grafana
# restart is not needed — the file provider re-reads the directory.
sidecar:
  dashboards:
    enabled: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: studio
        orgId: 1
        folder: Studio
        type: file
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/studio

dashboardsConfigMaps:
  studio: studio-dashboards

grafana.ini:
  analytics:
    reporting_enabled: false
    check_for_updates: false
  news:
    news_feed_enabled: false
  users:
    # No self-service signup: accounts come from Keycloak or from nowhere.
    allow_sign_up: false
  server:
    # Must match the address the browser actually uses. `localhost` is correct
    # for the port-forward; set it to the ingress host when that exists, or the
    # OAuth round trip returns to a URL nobody is listening on.
    domain: localhost
    root_url: "%(protocol)s://%(domain)s:%(http_port)s/"
  auth:
    # The local admin login stays available as a break-glass path — SSO that
    # cannot be bypassed is also SSO that locks you out when the IdP is the
    # thing that broke, which is exactly when the dashboards matter.
    disable_login_form: false

  # Keycloak SSO against the studio realm. OFF until the `grafana` client
  # exists in the deployed realm (see the ingress note above) — enabling it
  # first turns the login button into a dead end.
  #
  # A PUBLIC client with PKCE, the same shape studio-portal uses: Grafana holds
  # no client secret, so there is none to seal, rotate, or leak. Verified
  # against this image: `client_secret` is empty in its defaults.ini and
  # `use_pkce` is a supported key for this provider.
  #
  # `client_secret` is absent rather than set to "": the chart refuses to render
  # when that key appears in values at all (`assertNoLeakedSecrets`), which for
  # a public client is the outcome we wanted anyway.
  auth.generic_oauth:
    enabled: false
    name: Keycloak
    icon: signin
    client_id: grafana
    use_pkce: true
    scopes: "openid profile email"
    auth_url: "https://studio-dev.cfabric.org/auth/realms/studio/protocol/openid-connect/auth"
    token_url: "https://studio-dev.cfabric.org/auth/realms/studio/protocol/openid-connect/token"
    api_url: "https://studio-dev.cfabric.org/auth/realms/studio/protocol/openid-connect/userinfo"
    signout_redirect_url: "https://studio-dev.cfabric.org/auth/realms/studio/protocol/openid-connect/logout"
    email_attribute_path: email
    login_attribute_path: preferred_username
    name_attribute_path: name
    # Everyone who authenticates gets read-only. Dashboards are provisioned with
    # allowUiUpdates=false, so Editor would grant the right to change nothing
    # that survives a restart; Admin stays the local account. Map realm roles
    # here when there is a reason to.
    role_attribute_path: "'Viewer'"
    allow_sign_up: true
