# Postgres for the Studio backend (config/postgres.yaml profile).
#   docker compose up -d postgres
#   export STUDIO_PG_PASSWORD=studio
#   cargo run -- --config config/postgres.yaml run
services:
  postgres:
    image: postgres:16-alpine
    container_name: studio-backend-pg
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${STUDIO_PG_PASSWORD:-studio}
      POSTGRES_DB: studio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - studio_pg_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  studio_pg_data:
