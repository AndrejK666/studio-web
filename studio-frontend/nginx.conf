server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API (same-origin, mirrors the Vite dev proxy).
    # BACKEND_HOST is resolved at container start by nginx envsubst templates
    # if you rename this file to a template; with plain nginx.conf the service
    # name `studio-backend` from your compose/k8s network is used.
    location /cf/ {
        proxy_pass http://studio-backend:8090/cf/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE support
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
