name: Studio Delivery

# The single user-facing pipeline. It is introduced in preview mode first:
# Test runs in this graph while the established publish/deploy workflows stay
# authoritative until a full delivery run has been exercised in dev.
on:
  push:
    branches: ["**"]
    tags: ["v*", "infra-v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage set to execute
        required: true
        type: choice
        default: validate
        options:
          - validate
          - build
          - deploy-services
          - deploy-infra
      source_ref:
        description: Commit SHA, branch, or release tag (leave empty for the selected branch)
        required: false
        type: string
      environment:
        description: Deployment target (required for deploy-services or deploy-infra)
        required: false
        type: choice
        default: dev
        options:
          - dev
          - test
      component:
        description: Service component to deploy (deploy-services only)
        required: false
        type: choice
        default: all
        options:
          - all
          - backend
          - frontend
          - prototype
      image_tag:
        description: Immutable sha-<commit> snapshot or v* release tag (deploy-services only; must match source_ref)
        required: false
        type: string
      infra_tag:
        description: Published infrastructure release tag infra-vX.Y.Z (deploy-infra only)
        required: false
        type: string

permissions:
  # Used only by the tag-gated GitHub Release jobs in the reusable publish stage.
  contents: write
  # The reusable publish stage verifies the successful test run for the same
  # commit before it can publish immutable images.
  actions: read
  # The reusable publish stage pushes immutable images to GHCR.
  packages: write

concurrency:
  # Deployments serialize independently per target environment. A dev deploy
  # must never cancel an explicit test deploy (or the other way around).
  group: studio-delivery-${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'continuous' }}-${{ (inputs.stage == 'deploy-services' || inputs.stage == 'deploy-infra') && inputs.environment || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || (inputs.stage != 'deploy-services' && inputs.stage != 'deploy-infra') }}

jobs:
  test:
    name: 1. Test changed components
    if: github.event_name != 'workflow_dispatch' || inputs.stage == 'validate' || inputs.stage == 'build'
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ inputs.source_ref || github.sha }}
    secrets: inherit

  publish-preview:
    name: 2. Build & Publish (next stage)
    needs: test
    if: inputs.stage == 'validate'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Preview succeeded. The next migration adds the guarded Build & Publish stage here."

  publish:
    name: 2. Build & Publish
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.stage == 'build')
    uses: ./.github/workflows/release.yml
    with:
      source_sha: ${{ inputs.source_ref || github.sha }}
      # An explicit SHA/ref is intentionally not treated as main, so a manual
      # historical rebuild cannot advance the mutable edge channel.
      source_ref_name: ${{ inputs.source_ref || github.ref_name }}
      source_ref_type: ${{ github.ref_type }}
      publish_latest: false
      test_run_id: ${{ github.run_id }}
      backend: ${{ github.ref_type == 'tag' && 'true' || needs.test.outputs.backend }}
      frontend: ${{ github.ref_type == 'tag' && 'true' || needs.test.outputs.frontend }}
      prototype: ${{ github.ref_type == 'tag' && 'true' || needs.test.outputs.prototype }}
      theia: ${{ github.ref_type == 'tag' && 'true' || needs.test.outputs.theia }}
      any_service: ${{ github.ref_type == 'tag' && 'true' || (needs.test.outputs.backend == 'true' || needs.test.outputs.frontend == 'true' || needs.test.outputs.prototype == 'true' || needs.test.outputs.theia == 'true' || needs.test.outputs.deployment == 'true') && 'true' || 'false' }}
    secrets: inherit

  deploy-preview:
    name: 3. Deploy & Verify (next stage)
    needs: publish-preview
    if: inputs.stage == 'validate'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Preview succeeded. Deploy remains disabled until Build & Publish is proven in this graph."

  deploy-services:
    name: 3. Deploy Services
    if: inputs.stage == 'deploy-services'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ inputs.environment }}
      component: ${{ inputs.component }}
      image_tag: ${{ inputs.image_tag }}
      source_ref: ${{ inputs.source_ref || github.ref_name }}
    secrets: inherit

  deploy-infra:
    name: 3. Deploy Infrastructure
    if: inputs.stage == 'deploy-infra'
    uses: ./.github/workflows/deploy-infra.yml
    with:
      environment: ${{ inputs.environment }}
      infra_tag: ${{ inputs.infra_tag }}
    secrets: inherit
