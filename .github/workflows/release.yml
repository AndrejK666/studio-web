name: Release

# Tag-driven: push a tag `v*` (e.g. v0.1.0) to build, publish and deploy.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # GitHub Release
  packages: write   # GHCR push

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  backend-binary:
    runs-on: ubuntu-latest
    steps:
      # The gears revision is pinned in Cargo.toml, so a tag rebuilt next
      # week resolves the same sources as today.
      - uses: actions/checkout@v4

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio-backend

      - name: Build (release)
        working-directory: studio-backend
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: studio-backend-linux-x86_64
          path: studio-backend/target/release/studio-backend

  frontend-dist:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: studio-frontend-dist
          path: studio-frontend/dist

  images:
    needs: [backend-binary, frontend-dist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: studio-backend-linux-x86_64
          path: studio-backend/.release/
      - uses: actions/download-artifact@v4
        with:
          name: studio-frontend-dist
          path: studio-frontend/dist

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        run: |
          docker build -f studio-backend/Dockerfile \
            -t $IMAGE_PREFIX/studio-backend:${{ github.ref_name }} \
            -t $IMAGE_PREFIX/studio-backend:latest studio-backend
          docker push --all-tags $IMAGE_PREFIX/studio-backend

      - name: Build & push frontend image
        run: |
          docker build -f studio-frontend/Dockerfile \
            -t $IMAGE_PREFIX/studio-frontend:${{ github.ref_name }} \
            -t $IMAGE_PREFIX/studio-frontend:latest studio-frontend
          docker push --all-tags $IMAGE_PREFIX/studio-frontend

  github-release:
    needs: [backend-binary, frontend-dist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Pack artifacts
        run: |
          cd artifacts
          tar czf studio-backend-linux-x86_64.tar.gz -C studio-backend-linux-x86_64 .
          tar czf studio-frontend-dist.tar.gz -C studio-frontend-dist .
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/studio-backend-linux-x86_64.tar.gz
            artifacts/studio-frontend-dist.tar.gz

  deploy:
    needs: [images]
    runs-on: ubuntu-latest
    environment: production   # add reviewers in repo Settings -> Environments for a manual gate
    steps:
      - name: Deploy
        run: |
          echo "Images published:"
          echo "  $IMAGE_PREFIX/studio-backend:${{ github.ref_name }}"
          echo "  $IMAGE_PREFIX/studio-frontend:${{ github.ref_name }}"
          echo "TODO: wire the real target, e.g.:"
          echo "  - kubectl set image / helm upgrade (k8s)"
          echo "  - ssh + docker compose pull && up -d (single host)"
