name: Release

# Three ways in:
#   * a `v*` tag  — the real release: images tagged with the version + `latest`,
#     a GitHub Release with the artifacts, and the deploy gate.
#   * a push to main — images only, tagged `edge` and `sha-<short>`, so there is
#     something to pull between releases (studio-session already expects an
#     `:edge` tag for the Theia image; this gives the stack the same habit).
#   * manual — the reason `workflow_dispatch` is here at all: without it the
#     Actions page for this workflow has no "Run workflow" button, so a rebuild
#     of an unchanged tree meant pushing an empty commit or a throwaway tag.
on:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      publish_latest:
        description: "Also move the `latest` tag to this build"
        type: boolean
        default: false

permissions:
  contents: write   # GitHub Release
  packages: write   # GHCR push

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  backend-binary:
    runs-on: ubuntu-latest
    steps:
      # The gears revision is pinned in Cargo.toml, so a tag rebuilt next
      # week resolves the same sources as today.
      - uses: actions/checkout@v4

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio-backend

      - name: Build (release)
        working-directory: studio-backend
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: studio-backend-linux-x86_64
          path: studio-backend/target/release/studio-backend

  frontend-dist:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: studio-frontend-dist
          path: studio-frontend/dist

  images:
    needs: [backend-binary, frontend-dist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: studio-backend-linux-x86_64
          path: studio-backend/.release/
      - uses: actions/download-artifact@v4
        with:
          name: studio-frontend-dist
          path: studio-frontend/dist

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag release gets the version and `latest`; anything else gets `edge`
      # and an immutable `sha-` tag. `latest` is deliberately NOT moved by a
      # main push: something has to keep meaning "the last release".
      - name: Work out the image tags
        id: tags
        run: |
          set -euo pipefail
          short="sha-$(git rev-parse --short HEAD)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "list=${{ github.ref_name }} latest $short" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.publish_latest }}" = "true" ]; then
            echo "list=edge latest $short" >> "$GITHUB_OUTPUT"
          else
            echo "list=edge $short" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push backend image
        run: |
          set -euo pipefail
          args=()
          for t in ${{ steps.tags.outputs.list }}; do
            args+=(-t "$IMAGE_PREFIX/studio-backend:$t")
          done
          docker build -f studio-backend/Dockerfile "${args[@]}" studio-backend
          # --all-tags would also push tags this run did not build.
          for t in ${{ steps.tags.outputs.list }}; do
            docker push "$IMAGE_PREFIX/studio-backend:$t"
          done

      - name: Build & push frontend image
        run: |
          set -euo pipefail
          args=()
          for t in ${{ steps.tags.outputs.list }}; do
            args+=(-t "$IMAGE_PREFIX/studio-frontend:$t")
          done
          docker build -f studio-frontend/Dockerfile "${args[@]}" studio-frontend
          for t in ${{ steps.tags.outputs.list }}; do
            docker push "$IMAGE_PREFIX/studio-frontend:$t"
          done

      - name: Summary
        run: |
          {
            echo "### Images published"
            for t in ${{ steps.tags.outputs.list }}; do
              echo "- \`$IMAGE_PREFIX/studio-backend:$t\`"
              echo "- \`$IMAGE_PREFIX/studio-frontend:$t\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [backend-binary, frontend-dist]
    # A main push publishes images, not releases.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Pack artifacts
        run: |
          cd artifacts
          tar czf studio-backend-linux-x86_64.tar.gz -C studio-backend-linux-x86_64 .
          tar czf studio-frontend-dist.tar.gz -C studio-frontend-dist .
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/studio-backend-linux-x86_64.tar.gz
            artifacts/studio-frontend-dist.tar.gz

  deploy:
    needs: [images]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: production   # add reviewers in repo Settings -> Environments for a manual gate
    steps:
      - name: Deploy
        run: |
          echo "Images published:"
          echo "  $IMAGE_PREFIX/studio-backend:${{ github.ref_name }}"
          echo "  $IMAGE_PREFIX/studio-frontend:${{ github.ref_name }}"
          echo "TODO: wire the real target, e.g.:"
          echo "  - kubectl set image / helm upgrade (k8s)"
          echo "  - ssh + docker compose pull && up -d (single host)"
