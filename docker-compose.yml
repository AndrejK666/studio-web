# Constructor Studio — one-click dev environment.
#
#   Full stack (postgres + keycloak + backend built from source + frontend):
#     docker compose up --build -d
#     → portal:  http://localhost:8080   ("Continue with Constructor ID",
#                                         admin/studio or demo/studio)
#     → api/docs: http://localhost:8090/cf/docs
#
# Login goes through the bundled Keycloak (config/docker.yaml selects
# oidc-authn-plugin). The browser must accept its self-signed certificate
# once — open https://localhost:8443 and proceed, otherwise the redirect to
# the IdP dies silently. The portal's "Developer sign-in (static token)" is
# inert in this profile; it belongs to config/dev.yaml and config/postgres.yaml.
#
#   Database only (daily dev: backend in WSL, frontend via npm run dev):
#     docker compose up -d postgres
#
# NB: the backend image builds the 90-crate gears workspace — the first
# `--build` takes a while; BuildKit caches make rebuilds fast. No sibling
# checkout is needed — gears-rust is a git dependency pinned in Cargo.toml.

name: studio

services:
  postgres:
    image: postgres:16-alpine
    container_name: studio-backend-pg
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${STUDIO_PG_PASSWORD:-studio}
      POSTGRES_DB: studio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - studio_pg_data:/var/lib/postgresql/data
      - ./studio-backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 10

  # OIDC IdP for real login (config/oidc.yaml profile). Dev-grade: self-signed
  # TLS (certs in docker/keycloak/certs, CA trusted by the backend via
  # http_client.custom_ca_certificate_paths), realm imported on start.
  # Admin console: https://localhost:8443 (admin/admin). Realm users:
  # admin/studio, demo/studio. The studio-portal client whitelists both
  # localhost and 127.0.0.1 on :8080 (nginx) and :5173 (vite) — the portal
  # derives redirect_uri from window.location.origin, so opening the same
  # page under a hostname that is not in realm-studio.json fails the login
  # with "Invalid parameter: redirect_uri". NOT started by default `up` of backend+frontend
  # workflows that don't need it — but included in the default profile for
  # one-click friendliness; comment out if unwanted.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: studio-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/keycloak.key
      KC_HOSTNAME: "https://localhost:8443"
      # Frontchannel URLs (issuer, authorization endpoint) stay on the
      # hostname above — the browser has to reach those. Backchannel URLs
      # (token, JWKS, userinfo) are instead resolved from the Host header of
      # the incoming request, so when the backend container fetches discovery
      # from https://keycloak:8443 it gets endpoints on keycloak:8443 rather
      # than on a localhost that means "myself" inside that container.
      # Requires KC_HOSTNAME to be a full URL, which it is.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./docker/keycloak/realm-studio.json:/opt/keycloak/data/import/realm-studio.json:ro
      - ./docker/keycloak/certs:/opt/keycloak/certs:ro
    # The image has no shell utilities beyond bash, so the probe is a bash
    # /dev/tcp connect against the management port rather than curl.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: studio-backend/Dockerfile.src
    container_name: studio-backend
    environment:
      STUDIO_PG_PASSWORD: ${STUDIO_PG_PASSWORD:-studio}
      # Provider keys. Empty is a valid state: the features that need them
      # stay off and say so, rather than the stack refusing to start.
      #   Ask AI / mini-chat + the Codex agent  -> STUDIO_LLM_API_KEY
      #   the Claude Code agent in IDE sessions -> STUDIO_ANTHROPIC_API_KEY
      STUDIO_LLM_API_KEY: ${STUDIO_LLM_API_KEY:-}
      STUDIO_ANTHROPIC_API_KEY: ${STUDIO_ANTHROPIC_API_KEY:-}
      # The Theia session image lives in a private ghcr repo. The Docker API
      # ignores the CLI credential store, so the gear needs its own pair —
      # without them a session launch fails with a bare "unauthorized".
      STUDIO_REGISTRY_USER: ${STUDIO_REGISTRY_USER:-}
      STUDIO_REGISTRY_TOKEN: ${STUDIO_REGISTRY_TOKEN:-}
      # Read by the container ENTRYPOINT, not by any gear: it makes the
      # bind-mount below writable for the unprivileged server user. Keep it
      # equal to studio-session.workspaces_root in config/docker.yaml and to
      # the bind path below — all three name the same directory.
      STUDIO_WORKSPACES_ROOT: /srv/cf-studio-workspaces
    volumes:
      # studio-session gear: launches sibling Theia containers via the host
      # Docker daemon. The workspaces path must be IDENTICAL on host and in
      # this container — the gear passes it to the daemon as a host path.
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/cf-studio-workspaces:/srv/cf-studio-workspaces
      # CA of the dev Keycloak certificate. The OIDC plugin refuses plain
      # http for IdP endpoints, so the self-signed chain has to be trusted
      # explicitly — the paths are named in overrides.docker/*.yaml.
      - ./docker/keycloak/certs/dev-ca.pem:/app/certs/dev-ca.pem:ro
    ports:
      - "127.0.0.1:8090:8090"   # direct API + /cf/docs
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 15

  frontend:
    build:
      context: .
      dockerfile: studio-frontend/Dockerfile.src
    container_name: studio-frontend
    ports:
      - "127.0.0.1:8080:8080"   # image is nginx-unprivileged: listens on 8080
    depends_on:
      backend:
        condition: service_healthy
    # nginx.conf proxies /cf/ to http://studio-backend:8090 — the service's
    # container_name above must stay in sync with it.

volumes:
  studio_pg_data:
    # Pinned to the volume created by the ORIGINAL studio-backend compose
    # project (before `name: studio` unified everything): regrouping the
    # containers must not orphan the Postgres data. Fresh machines simply
    # get a volume with this name.
    name: studio-backend_studio_pg_data
